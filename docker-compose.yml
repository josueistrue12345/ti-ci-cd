# CI/CD de mobofacil: Jenkins + SonarQube (+ Postgres para SonarQube).
# Todo se levanta solo con Docker Compose:
#   cp .env.example .env   # y llena los valores
#   docker compose up -d --build
name: mobofacil-ci

services:
  sonar-db:
    image: postgres:17
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:?Falta SONAR_DB_PASSWORD en .env}
      POSTGRES_DB: sonar
    volumes:
      - sonar-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    depends_on:
      sonar-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD}
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc: 8192
    ports:
      - "${SONAR_PORT:-9000}:9000"
    volumes:
      - sonar-data:/opt/sonarqube/data
      - sonar-extensions:/opt/sonarqube/extensions
      - sonar-logs:/opt/sonarqube/logs
    restart: unless-stopped

  # Corre una vez en cada `up`: cambia la contraseña por defecto de SonarQube
  # y deja el token de análisis para Jenkins en el volumen sonar-token.
  sonar-init:
    image: curlimages/curl:8.11.1
    user: root
    depends_on:
      - sonarqube
    environment:
      SONAR_ADMIN_PASSWORD: ${SONAR_ADMIN_PASSWORD:?Falta SONAR_ADMIN_PASSWORD en .env}
    volumes:
      - ./sonar-init/init.sh:/init.sh:ro
      - sonar-token:/secrets
    entrypoint: ["sh", "/init.sh"]
    restart: "no"

  jenkins:
    build: ./jenkins
    container_name: jenkins
    depends_on:
      sonar-init:
        condition: service_completed_successfully
    # Usuario jenkins + grupo docker del servidor para usar el socket sin ser root
    group_add:
      - "${DOCKER_GID:?Falta DOCKER_GID en .env}"
    environment:
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false
      CASC_JENKINS_CONFIG: /usr/share/jenkins/ref/casc.yaml
      JENKINS_URL: ${JENKINS_URL:?Falta JENKINS_URL en .env}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?Falta JENKINS_ADMIN_PASSWORD en .env}
      GIT_REPO_URL: ${GIT_REPO_URL:?Falta GIT_REPO_URL en .env}
      GIT_USERNAME: ${GIT_USERNAME:?Falta GIT_USERNAME en .env}
      GIT_TOKEN: ${GIT_TOKEN:?Falta GIT_TOKEN en .env}
    ports:
      - "${JENKINS_PORT:-8081}:8080"
    volumes:
      - jenkins-home:/var/jenkins_home
      # Jenkins construye imágenes con el Docker del servidor
      - /var/run/docker.sock:/var/run/docker.sock
      - sonar-token:/var/ci-secrets:ro
    restart: unless-stopped

volumes:
  sonar-db:
  sonar-data:
  sonar-extensions:
  sonar-logs:
  sonar-token:
  jenkins-home:

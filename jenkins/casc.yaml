# Configuración de Jenkins como código: se aplica cada vez que arranca el contenedor.
# Los ${...} vienen de las variables de entorno (.env); el token de SonarQube
# lo deja el servicio sonar-init en /var/ci-secrets.
jenkins:
  systemMessage: "CI/CD de mobofacil"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: ${JENKINS_ADMIN_PASSWORD}
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: sonar-token
              description: Token de análisis de SonarQube
              secret: ${readFile:/var/ci-secrets/sonar_token}
          - usernamePassword:
              scope: GLOBAL
              id: git-cred
              description: Acceso de lectura a los repos de GIT_REPOS
              username: ${GIT_USERNAME}
              password: ${GIT_TOKEN}
          - usernamePassword:
              scope: GLOBAL
              id: registry-cred
              description: Push de imágenes al registry
              username: ${REGISTRY_USERNAME}
              password: ${REGISTRY_TOKEN}
          # Lo genera k8s/crear-kubeconfig.sh: solo despliega en el namespace mobofacil
          - file:
              scope: GLOBAL
              id: kubeconfig
              description: Acceso al cluster de Kubernetes remoto
              fileName: kubeconfig
              secretBytes: ${readFileBase64:/var/k8s/kubeconfig}

unclassified:
  location:
    url: ${JENKINS_URL}
  sonarGlobalConfiguration:
    buildWrapperEnabled: true
    installations:
      - name: sonarqube
        serverUrl: http://sonarqube:9000
        credentialsId: sonar-token

# Un job multibranch por cada repo de GIT_REPOS (separados por coma), nombrado como el repo:
# cada rama con Jenkinsfile se vuelve un pipeline. Revisa los repos cada minuto
# y construye las ramas con commits nuevos.
jobs:
  - script: |
      '${GIT_REPOS}'.split(',').collect { it.trim() }.findAll { it }.each { repoUrl ->
        def name = repoUrl.tokenize('/').last().replaceFirst('\\.git$', '')
        multibranchPipelineJob(name) {
          displayName(name)
          branchSources {
            git {
              id(name + '-remote')
              remote(repoUrl)
              credentialsId('git-cred')
            }
          }
          orphanedItemStrategy {
            discardOldItems {
              numToKeep(5)
            }
          }
          triggers {
            periodicFolderTrigger {
              interval('1m')
            }
          }
        }
      }
